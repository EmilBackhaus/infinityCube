<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#131b2b">
  <title>Würfel-Sprung – Side-Scroller</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="stage">
    <canvas id="game" width="960" height="540" aria-label="Würfel-Sprung: Springe über Hindernisse und Löcher"></canvas>
  </main>

  <p class="hint">
    <kbd>Leertaste</kbd> / <kbd>↑</kbd> / Klick / Tippen: springen
    &nbsp;·&nbsp;
    in der Luft nochmal: Doppelsprung
    &nbsp;·&nbsp;
    ab 10.000: Klick = Flügelschlag
    &nbsp;·&nbsp;
    <kbd>M</kbd>: Ton an/aus
    <br>
    Cheat: <kbd>W</kbd>-<kbd>A</kbd>-<kbd>S</kbd>-<kbd>D</kbd> = unverwundbar
  </p>

  <script src="constants.js"></script>
  <script src="utils.js"></script>
  <script src="canvas.js"></script>
  <script src="state.js"></script>
  <script src="audio.js"></script>
  <script src="die.js"></script>
  <script src="render.js"></script>
  <script src="logic.js"></script>
  <script src="input.js"></script>
  <script src="main.js"></script>
</body>
</html>
